name: Release notes

# Manual run only: Actions > Release notes > Run workflow.
# Rewrites the notes of an existing release so they describe every extension
# (what it does and its in-app menu), using extensions/*/RELEASE.md from the
# branch the workflow runs on. Release files are not touched.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to update (for example v0.3.0)"
        type: string
        required: true
      notes:
        description: "What's new text (optional)"
        type: string
        required: false

permissions:
  contents: write

jobs:
  notes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Write release notes
        env:
          TAG: ${{ inputs.tag }}
          NOTES: ${{ inputs.notes }}
        run: ./scripts/release-notes.sh "$TAG" "$NOTES" > RELEASE_NOTES.md

      - name: Update release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: gh release edit "$TAG" --notes-file RELEASE_NOTES.md
